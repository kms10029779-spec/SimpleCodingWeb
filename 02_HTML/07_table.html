<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <table border="1">
      <!-- 제목 -->
      <!-- 자동정렬 단축기 : shift + alt + f -->
      <tr>
        <!-- 내용, tr(행), td(열 일반글씨), th(열 굵은 글씨) -->
        <th></th>
        <th scope="col">월</th>
        <th scope="col">화</th>
        <th scope="col">수</th>
        <th scope="col">목</th>
        <th scope="col">금</th>
      </tr>
      <!-- 내용 -->
      <tr>
        <th scope="row">1교시</th>
        <td>영어</td>
        <td>국어</td>
        <td>과학</td>
        <td>미술</td>
        <td>기술</td>
      </tr>
      <tr>
        <td>3교시</td>
        <td>HTML</td>
        <td>CSS</td>
        <td>JS</td>
        <td>JAVA</td>
        <td>SPRING</td>
      </tr>
    </table>
  </body>
</html>
