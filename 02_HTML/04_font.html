<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Lorem ipsum dolor sit amet</p>
    <!-- b: 굵은 글씨 -->
    <p><b>Lorem ipsum dolor sit amet</b></p>
    <!-- i: 기울림체 -->
    <p><i> Lorem ipsum dolor sit amet</i></p>
    <!-- small : 작은 글씨 -->
    <p><small>Lorem ipsum dolor sit amet</small></p>
    <!-- sup : 위 첨자 -->
    <p>Lorem <sup>ipsum</sup> dolor sit amet</p>
    <!-- sub : 아래 첨자 -->
    <p>Lorem <sub>ipsum</sub> dolor sit amet</p>
    <!-- ins : 밑줄 -->
    <p>Lorem <ins>ipsum</ins> dolor sit amet</p>
    <!-- del : 가운데줄 -->
    <p>Lorem <del>ipsum</del> dolor sit amet</p>

    <!-- ☆ br : 줄바꿈 ☆ -->
    <p>Lorem ipsum dolor <br> sit amet</p>
    <!-- ☆ hr : ☆ -->
    <hr>
    <p>Lorem ipsum dolor sit amet</p>


</body>
</html>
